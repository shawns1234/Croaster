; ============================================================================
; Croaster PID board (heater + fan control): ESP32-S3 N16R8 (Lonely Binary Gold Edition / DevKitM-1)
; ----------------------------------------------------------------------------
; Standalone PlatformIO project, like every boards/<board>/ folder. Consumes:
;   ../../croaster        Croaster library (WiFi, WebSocket :81, BLE, OTA, RoR)
;   ../common             Croaster's shared SSD1306 display (optional)
;   ../../croaster-control  control add-on: src/core pure logic (PID, autotune,
;                           profile, protocol), src/hw drivers (probes, SSR, fan),
;                           src/app control task and ControlPlugin
; Your hardware choices: src/config.h (the only file to edit).
;
;   pio run -e esp32s3-pid      # release build (what ../../build_all.sh runs)
;   pio run -t upload            # flash over USB
;   pio device monitor
;   pio test -e native           # host unit tests for croaster-control/src/core
; ============================================================================

[platformio]
default_envs = esp32s3-pid
boards_dir = ..

[env]
lib_deps =
	Croaster=symlink://../../croaster
	CroasterDisplaySSD1306=symlink://../common
	CroasterControl=symlink://../../croaster-control
	links2004/WebSockets@^2.7.3
	bblanchon/ArduinoJson@^7.4.3
	adafruit/Adafruit SSD1306@^2.5.17
	tzapu/WiFiManager@^2.0.17

; Default: standard PlatformIO platform, pinned (espressif32 8.0.0 = Arduino-ESP32
; 3.3.12 on ESP-IDF 5.5) so a platform release cannot silently change the build.
[env:esp32s3-pid]
board = esp32-s3-devkitm1-n16r8
framework = arduino
platform = platformio/espressif32 @ 8.0.0
build_type = release
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
; ESP-IDF Kconfig defaults: Croaster's own file in boards/esp32s3 (one copy for both S3 boards).
board_build.sdkconfig_path = ../esp32s3/esp32s3-sdkconfig.defaults
board_build.partitions = default_16MB.csv
; config.h is force-included; the script makes it a rebuild dependency.
extra_scripts = pre:../../tools/force_include_deps.py
build_flags =
	-include "${PROJECT_DIR}/src/config.h"
	-D BOARD_HAS_PSRAM
	; Serial on the native USB-C port (GPIO19/20). Using the board's other
	; (USB-UART bridge) port for logs? set ARDUINO_USB_CDC_ON_BOOT=0.
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-Wno-deprecated-declarations

[env:esp32s3-pid-debug]
extends = env:esp32s3-pid
build_type = debug
build_flags = ${env:esp32s3-pid.build_flags} -D CORE_DEBUG_LEVEL=3

; Alternative platform: pioarduino (same Arduino-ESP32 3.3.12 today; follows new
; Arduino-ESP32 releases sooner).
[env:esp32s3-pid-pioarduino]
extends = env:esp32s3-pid
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip

; Optional: compile ESP-IDF with Croaster's esp32s3-sdkconfig.defaults. 
; Not needed: this firmware uses no TLS, and PSRAM malloc is already enabled in the stock libraries.
; Generated files (managed_components/, sdkconfig.*, CMakeLists.txt...) are gitignored.
; Note: IN/OUT_CONTENT_LEN in that file only apply with
; CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y (see docs/design.md).

; Host-side unit tests (no hardware):  pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17
; croaster-control/build_filter.py limits this env to src/core.
lib_deps =
	CroasterControl=symlink://../../croaster-control
	bblanchon/ArduinoJson@^7.4.3
lib_compat_mode = off
