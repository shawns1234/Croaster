; ============================================================================
; Croaster monitor board (probes only): ESP32-S3 N16R8 (Lonely Binary Gold Edition / DevKitM-1)
; ----------------------------------------------------------------------------
; Standalone PlatformIO project, like every boards/<board>/ folder. Same
; hardware as boards/esp32s3-pid without the heater and fan. Consumes:
;   ../../croaster          Croaster library (WiFi, WebSocket :81, BLE, OTA, RoR)
;   ../common               Croaster's shared SSD1306 display (optional)
;   ../../croaster-control  hw/thermocouples (MAX31855 or MAX6675 reader) and
;                           app/MonitorProbes (bridge into CroasterCore)
; Your hardware choices: src/config.h (the only file to edit).
;
;   pio run -e esp32s3-monitor   # release build (what ../../build_all.sh runs)
;   pio run -t upload            # flash over USB
;   pio device monitor
; ============================================================================

[platformio]
default_envs = esp32s3-monitor
boards_dir = ..

[env]
lib_deps =
	Croaster=symlink://../../croaster
	CroasterDisplaySSD1306=symlink://../common
	CroasterControl=symlink://../../croaster-control
	links2004/WebSockets@^2.7.3
	bblanchon/ArduinoJson@^7.4.3
	adafruit/Adafruit SSD1306@^2.5.17
	tzapu/WiFiManager@^2.0.17

; Standard PlatformIO platform, pinned like boards/esp32s3-pid (espressif32
; 8.0.0 = Arduino-ESP32 3.3.12 on ESP-IDF 5.5).
[env:esp32s3-monitor]
board = esp32-s3-devkitm1-n16r8
framework = arduino
platform = platformio/espressif32 @ 8.0.0
build_type = release
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
; ESP-IDF Kconfig defaults: Croaster's own file in boards/esp32s3 (one copy for all S3 boards).
board_build.sdkconfig_path = ../esp32s3/esp32s3-sdkconfig.defaults
board_build.partitions = default_16MB.csv
; config.h is force-included; the script makes it a rebuild dependency.
extra_scripts = pre:../../tools/force_include_deps.py
build_flags =
	-include "${PROJECT_DIR}/src/config.h"
	-D BOARD_HAS_PSRAM
	; Serial on the native USB-C port (GPIO19/20). Using the board's other
	; (USB-UART bridge) port for logs? set ARDUINO_USB_CDC_ON_BOOT=0.
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-Wno-deprecated-declarations

; Debug build for ../../upload_monitor.sh (never shipped by build_all.sh).
[env:esp32s3-monitor-debug]
extends = env:esp32s3-monitor
build_type = debug
build_flags = ${env:esp32s3-monitor.build_flags} -D CORE_DEBUG_LEVEL=3
